name: Redirect legacy GitHub Pages to Google Hosting

on:
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: 'Publish the redirect to https://spot-info.web.app/'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.confirm_publication == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: legacy-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
